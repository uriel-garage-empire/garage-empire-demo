function shapeOf(cid){if(cid>=32)return CAR_ADDITIONS[cid-32][6];const n=CARS[cid][0];if(/Chiron|Jesko|Huayra/.test(n))return 'hyper';if(/Ferrari|Lamborghini|McLaren|NSX/.test(n))return 'super';if(/MX-5|S2000/.test(n))return 'roadster';if(/Yaris/.test(n))return 'hatch';if(/Mustang|Camaro|Viper/.test(n))return 'muscle';if(/GT-R/.test(n))return 'gtr';if(/Excel|Sunny|Cerato|Lanos|Chaser|Impreza|Evo|Plaid/.test(n))return 'sedan';return 'sports'}
